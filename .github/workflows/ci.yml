name: validate

on:
  push:
  pull_request:

jobs:
  python-and-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r src/ppt_tool/requirements.txt opencv-python numpy
      - run: python scripts/validate_project.py
